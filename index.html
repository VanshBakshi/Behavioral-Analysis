<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Behavioral Analysis AI</title><style>body{font-family:Arial;background:#0b1020;color:#eee;margin:0}.wrap{max-width:1100px;margin:auto;padding:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#151e34;padding:20px;border-radius:14px}label{display:block;margin:10px 0 0}input{width:100%;box-sizing:border-box;padding:9px;background:#0b1223;color:#fff;border:1px solid #405070;border-radius:6px}button{padding:12px;margin-top:18px;background:#557cff;color:#fff;border:0;border-radius:7px;font-weight:bold}.score{font-size:42px;font-weight:bold}pre{background:#090f1d;padding:15px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class=wrap><h1>Behavioral Analysis AI</h1><p>Advanced defensive UEBA — Isolation Forest + PyTorch Autoencoder</p><div class=grid><div class=card><h2>Behavior Event</h2><div id=form></div><button onclick=analyze()>Analyze Behavior</button></div><div class=card><h2>Result</h2><div id=risk class=score>—</div><h3 id=sev>—</h3><p id=status>Ready</p><h3>Reasons</h3><ul id=reasons></ul><pre id=details>—</pre></div></div></div><script>const fs=['hour','login_count_24h','failed_logins_24h','session_minutes','files_accessed_24h','downloads_mb_24h','uploads_mb_24h','unique_ips_24h','new_devices_7d','admin_actions_24h','process_count_24h','network_connections_24h','geo_distance_km','password_changes_30d'];form.innerHTML='<label>User ID<input id=user_id value=user_001></label><label>Device ID<input id=device_id value=device_001></label>'+fs.map((x,i)=>`<label>${x}<input id=${x} type=number value=${[10,4,1,70,25,120,60,2,0,0,120,220,5,0][i]}></label>`).join('');async function analyze(){let d={user_id:user_id.value,device_id:device_id.value};fs.forEach(x=>d[x]=+document.getElementById(x).value);let r=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),x=await r.json();risk.textContent=x.risk_score+'/100';sev.textContent=x.severity;status.textContent=x.is_anomaly?'Anomalous behavior detected — review required.':'Normal range';reasons.innerHTML=(x.reasons.length?x.reasons:['No strong individual deviation']).map(v=>'<li>'+v+'</li>').join('');details.textContent=JSON.stringify(x,null,2)}</script></body></html>
